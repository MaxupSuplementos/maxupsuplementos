// Fuzzy match
function findProduct(q){
  if(!q)return null;
  const words=q.replace(/\[.*?\]/g,'').toLowerCase().split(/\s+/).filter(w=>w.length>2);
  let best=null,bestScore=0;
  P.forEach(p=>{
    const name=(p.n+' '+p.b).toLowerCase();
    let hits=0;
    words.forEach(w=>{if(name.indexOf(w)>=0)hits++});
    const score=words.length>0?hits/words.length:0;
    if(score>bestScore){bestScore=score;best=p}
  });
  return bestScore>=0.4?best:null;
}

// Drawing helpers
function solidText(ctx,t,x,y,color,font,align){
  ctx.save();ctx.font=font;ctx.textAlign=align||'center';
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillText(t,x+2,y+2);
  ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore();
}
function wrapSolid(ctx,t,x,y,mw,lh,color,font){
  ctx.save();ctx.font=font;ctx.textAlign='center';
  const w=t.split(' ');let l='',lines=[];
  for(const s of w){const test=l+s+' ';if(ctx.measureText(test).width>mw&&l!==''){lines.push(l.trim());l=s+' '}else l=test}
  lines.push(l.trim());
  lines.forEach((ln,i)=>{
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(ln,x+2,y+i*lh+2);
    ctx.fillStyle=color;ctx.fillText(ln,x,y+i*lh);
  });
  ctx.restore();return y+(lines.length-1)*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function smokeGlow(ctx,cx,cy,radius){
  ctx.save();
  [['rgba(0,200,255,.12)','rgba(0,200,255,0)',-.3,-.2],
   ['rgba(255,0,153,.1)','rgba(255,0,153,0)',.25,.15],
   ['rgba(153,51,255,.08)','rgba(153,51,255,0)',0,.3]].forEach(([c1,c2,ox,oy])=>{
    const g=ctx.createRadialGradient(cx+radius*ox,cy+radius*oy,0,cx,cy,radius);
    g.addColorStop(0,c1);g.addColorStop(.5,c1.replace(/\.\d+\)/,'.03)'));g.addColorStop(1,c2);
    ctx.fillStyle=g;ctx.fillRect(cx-radius,cy-radius,radius*2,radius*2);
  });ctx.restore();
}

function dailyCategory(p){
  const raw=String(p.cat||'otros').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(raw.includes('creatina'))return 'creatina';
  if(raw.includes('prote'))return 'proteina';
  if(raw.includes('pre')&&raw.includes('entren'))return 'preworkout';
  if(raw.includes('amino')||raw.includes('glutamina')||raw.includes('carnitina'))return 'aminoacido';
  if(raw.includes('colag'))return 'colageno';
  if(raw.includes('vitamin')||raw.includes('mineral'))return 'vitamin';
  if(raw.includes('ganador')||raw.includes('gainer'))return 'gainer';
  if(raw.includes('hidrat')||raw.includes('isot'))return 'hidratacion';
  if(raw.includes('barra')||raw.includes('snack'))return 'barra';
  if(raw.includes('shaker')||raw.includes('vaso'))return 'shaker';
  if(raw.includes('accesor'))return 'accesorio';
  if(raw.includes('indument')||raw.includes('ropa'))return 'indumentaria';
  return raw||'otros';
}

function effectiveDailyDate(){
  if(dailyDate)return dailyDate;
  try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date())}
  catch(err){return new Date().toISOString().slice(0,10)}
}

function dailyScore(value){
  const text=effectiveDailyDate()+'|'+String(value||'');let hash=2166136261;
  for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619)}
  return hash>>>0;
}

function safeFilePart(value){
  return String(value||'producto').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)||'producto';
}

function dailyFilename(p,index){
  const date=effectiveDailyDate();
  return `MAXUP_estado_${String(index+1).padStart(2,'0')}_${safeFilePart(p.n)}_${date}.png`;
}

async function drawDailyStory(canvas,p,index,total){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const W=1080,H=1920,ctx=canvas.getContext('2d');
  canvas.width=W;canvas.height=H;

  ctx.fillStyle='#08090b';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.035;ctx.strokeStyle='#fff';ctx.lineWidth=1;
  for(let i=-H;i<W+H;i+=56){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke()}
  ctx.restore();

  let g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#00C8FF');g.addColorStop(.5,'#FF0099');g.addColorStop(1,'#9933FF');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,8);
  ctx.fillStyle=g;ctx.fillRect(0,H-8,W,8);

  rr(ctx,70,175,W-140,86,18);ctx.fillStyle='rgba(255,255,255,.045)';ctx.fill();
  ctx.strokeStyle='rgba(0,200,255,.35)';ctx.lineWidth=2;ctx.stroke();
  solidText(ctx,'RECOMENDADO DEL DIA',W/2,234,'#fff',"bold 50px 'Bebas Neue',sans-serif");
  solidText(ctx,`${index+1} DE ${total}`,W-92,148,'#777',"600 22px 'Rajdhani',sans-serif",'right');

  smokeGlow(ctx,W/2,680,420);
  const img=await li(p.img);
  if(img){
    const ratio=img.width/img.height;let dw,dh;const maxW=620,maxH=650;
    if(ratio>maxW/maxH){dw=maxW;dh=maxW/ratio}else{dh=maxH;dw=maxH*ratio}
    ctx.drawImage(img,W/2-dw/2,680-dh/2,dw,dh);
  }

  const nameEnd=wrapSolid(ctx,String(p.n||'').toUpperCase(),W/2,1080,W-130,55,'#fff',"bold 48px 'Rajdhani',sans-serif");
  const brandY=Math.min(nameEnd+58,1250);
  solidText(ctx,String(p.b||'MAXUP'),W/2,brandY,'#00C8FF',"600 30px 'Rajdhani',sans-serif");

  const benefitY=Math.max(1315,brandY+48);
  rr(ctx,70,benefitY,W-140,165,18);ctx.fillStyle='rgba(153,51,255,.10)';ctx.fill();
  ctx.strokeStyle='rgba(153,51,255,.35)';ctx.lineWidth=2;ctx.stroke();
  solidText(ctx,'POR QUE ELEGIRLO',W/2,benefitY+43,'#FF0099',"bold 24px 'Rajdhani',sans-serif");
  wrapSolid(ctx,dailyBenefit(p),W/2,benefitY+88,W-210,40,'#eee',"600 29px 'Rajdhani',sans-serif");

  solidText(ctx,fmt(Number(p.p)||0),W/2,1555,'#FF0099',"bold 92px 'Bebas Neue',sans-serif");
  rr(ctx,W/2-210,1600,420,68,34);ctx.fillStyle=g;ctx.fill();
  solidText(ctx,'PEDILO POR WHATSAPP',W/2,1646,'#fff',"bold 29px 'Rajdhani',sans-serif");
  solidText(ctx,'maxupsuplementos.com.ar',W/2,1722,'#aaa',"600 26px 'Rajdhani',sans-serif");
  solidText(ctx,'@maxupsuplementos',W/2,1762,'#666',"500 23px 'Rajdhani',sans-serif");

  if(logoImg){
    const la=logoImg.width/logoImg.height;
    const lh=80,lw=lh*la;
    ctx.drawImage(logoImg,W/2-lw/2,82,lw,lh);
  }
}

function downloadDaily(canvas,p,index){
  const a=document.createElement('a');
  a.download=dailyFilename(p,index);a.href=canvas.toDataURL('image/png');a.click();
}

async function shareDaily(canvas,p,index,status){
  status.textContent='Preparando imagen...';
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob){status.textContent='No se pudo preparar la imagen.';return}
  const file=new File([blob],dailyFilename(p,index),{type:'image/png'});
  try{
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      await navigator.share({files:[file],title:`MAXUP - ${p.n}`});
      status.textContent='Imagen compartida.';
    }else{
      downloadDaily(canvas,p,index);
      status.textContent='Tu navegador no permite compartir archivos; la imagen fue descargada.';
    }
  }catch(err){
    status.textContent=err&&err.name==='AbortError'?'Compartir cancelado.':'No se pudo compartir; podés usar Guardar foto.';
  }
}

async function renderDaily(products){
  const grid=document.getElementById('dailyGrid');
  grid.innerHTML='';grid.hidden=false;
  document.getElementById('dailyHelp').style.display='block';
  document.getElementById('singleBtns').hidden=true;
  document.getElementById('cv').hidden=true;
  document.getElementById('st').hidden=true;
  document.getElementById('info').textContent=`Publicaciones diarias - ${effectiveDailyDate()}`;
  document.getElementById('found').textContent=`${products.length} placas verticales listas para guardar o compartir`;

  for(let index=0;index<products.length;index++){
    const p=products[index];
    const card=document.createElement('section');card.className='daily-card';
    const title=document.createElement('h2');title.textContent=`${index+1}. ${p.n}`;
    const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;
    const actions=document.createElement('div');actions.className='daily-actions';
    const save=document.createElement('button');save.className='btn bd';save.textContent='Guardar foto';
    const share=document.createElement('button');share.className='btn bs';share.textContent='Compartir';
    const status=document.createElement('div');status.className='daily-status';status.textContent='Generando placa...';
    save.addEventListener('click',()=>downloadDaily(canvas,p,index));
    share.addEventListener('click',()=>shareDaily(canvas,p,index,status));
    actions.append(save,share);card.append(title,canvas,actions,status);grid.appendChild(card);
    try{await drawDailyStory(canvas,p,index,products.length);status.textContent='Lista para publicar.'}
    catch(err){status.textContent='No se pudo generar esta placa: '+err.message}
  }
}

function resolveDailyProducts(){
  const selected=[],seen=new Set();
  function add(p){if(!p)return;const key=String(p.id||'')+'|'+p.n;if(seen.has(key))return;seen.add(key);selected.push(p)}
  dailyIds.forEach(id=>add(P.find(p=>String(p.id)===String(id))));
  dailyNames.forEach(name=>{if(selected.length<5)add(findProduct(name.toLowerCase()))});
  const eligible=P.filter(p=>p.p>0&&p.img&&(typeof p.stock==='undefined'||p.stock>0))
    .sort((a,b)=>dailyScore((a.id||a.n)+'|'+a.n)-dailyScore((b.id||b.n)+'|'+b.n));
  const usedCategories=new Set(selected.map(dailyCategory));
  eligible.forEach(p=>{
    const cat=dailyCategory(p);
    if(selected.length<5&&!usedCategories.has(cat)){add(p);usedCategories.add(cat)}
  });
  eligible.forEach(p=>{if(selected.length<5)add(p)});
  return selected.slice(0,5);
}

async function genPost(p,disc,W,H){
  const cv=document.getElementById('cv');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  const isStory=H>1400;
  const price=p.p;
  const np=Math.round(price*(1-disc/100));

  // Background
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.025;ctx.strokeStyle='#fff';ctx.lineWidth=1;
  for(let i=-H;i<W+H;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke()}
  ctx.restore();

  // Top bar gradient
  let g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#00C8FF');g.addColorStop(.5,'#FF0099');g.addColorStop(1,'#9933FF');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,5);
  // Bottom bar
  g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#9933FF');g.addColorStop(.5,'#FF0099');g.addColorStop(1,'#00C8FF');
  ctx.fillStyle=g;ctx.fillRect(0,H-5,W,5);

  // Title bar
  const titleY=isStory?40:30;
  rr(ctx,50,titleY,W-100,80,10);
  g=ctx.createLinearGradient(50,titleY,W-50,titleY);g.addColorStop(0,'#FF0099');g.addColorStop(1,'#9933FF');
  ctx.fillStyle=g;ctx.fill();
  solidText(ctx,'OFERTA ESPECIAL',W/2,titleY+55,'#fff',"bold 48px 'Bebas Neue',sans-serif");

  // Separator
  const sepY=titleY+100;
  ctx.strokeStyle='#00C8FF';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-160,sepY);ctx.lineTo(W/2+160,sepY);ctx.stroke();

  // Product image with smoke glow
  const imgY=isStory?580:460;
  smokeGlow(ctx,W/2,imgY,350);
  const img=await li(p.img);
  if(img){
    const a=img.width/img.height;let dw,dh;
    const mW=isStory?560:500,mH=isStory?560:480;
    if(a>mW/mH){dw=mW;dh=mW/a}else{dh=mH;dw=mH*a}
    ctx.drawImage(img,W/2-dw/2,imgY-dh/2,dw,dh);
  }

  // Product name
  const nameY=isStory?960:790;
  wrapSolid(ctx,p.n.toUpperCase(),W/2,nameY,W-100,52,'#fff',"bold 46px 'Rajdhani',sans-serif");
  solidText(ctx,p.b,W/2,nameY+60,'#00C8FF',"500 28px 'Rajdhani',sans-serif");

  // Prices
  const priceY=isStory?1100:920;
  solidText(ctx,fmt(price),W/2,priceY,'#666',"500 32px 'Rajdhani',sans-serif");
  ctx.save();ctx.font="500 32px 'Rajdhani',sans-serif";const m=ctx.measureText(fmt(price)).width;
  ctx.strokeStyle='#FF0099';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-m/2,priceY-5);ctx.lineTo(W/2+m/2,priceY-5);ctx.stroke();ctx.restore();

  solidText(ctx,fmt(np),W/2,priceY+80,'#FF0099',"bold 82px 'Bebas Neue',sans-serif");

  // Discount badge
  rr(ctx,W/2-70,priceY+95,140,40,20);ctx.fillStyle='#9933FF';ctx.fill();
  solidText(ctx,'-'+disc+'% OFF',W/2,priceY+123,'#fff',"bold 24px 'Rajdhani',sans-serif");

  // CTA
  const ctaY=isStory?1320:1170;
  rr(ctx,W/2-160,ctaY,320,60,30);
  g=ctx.createLinearGradient(W/2-160,0,W/2+160,0);g.addColorStop(0,'#00C8FF');g.addColorStop(1,'#9933FF');
  ctx.fillStyle=g;ctx.fill();
  solidText(ctx,'APROVECHA AHORA',W/2,ctaY+40,'#fff',"bold 26px 'Rajdhani',sans-serif");

  // "SOLO POR TIEMPO LIMITADO"
  solidText(ctx,'SOLO POR TIEMPO LIMITADO',W/2,ctaY+85,'#888',"600 20px 'Rajdhani',sans-serif");

  // Logo
  if(logoImg){const la=logoImg.width/logoImg.height;ctx.drawImage(logoImg,24,H-68,38*la,38)}
  solidText(ctx,'@maxupsuplementos',W-30,H-25,'#555',"500 20px 'Rajdhani',sans-serif",'right');
}

let product=null;

async function init(){
  document.getElementById('info').textContent='Cargando catálogo...';
  // Intentar cargar desde API
  try{
    const resp=await fetch(API_URL+'?accion=catalogo');
    const data=await resp.json();
    if(data.productos && data.productos.length>0){
      P=data.productos.map(function(pr){
        var imgUrl=String(pr.imagen_url||'').trim();
        // Si la imagen no pasa por weserv, proxyarla para evitar CORS
        if(imgUrl && imgUrl.indexOf('weserv.nl')<0 && imgUrl.indexOf('data:')<0){
          imgUrl='https://images.weserv.nl/?url='+encodeURIComponent(imgUrl.replace(/^https?:\/\//,''))+'&w=500&output=webp&q=82';
        }
        return {
          id:pr.id||pr.nombre,
          n:pr.nombre||'',
          b:pr.marca||'',
          p:Number(pr.precio_venta)||0,
          img:imgUrl,
          cat:pr.categoria||'otros',
          desc:pr.descripcion||'',
          stock:Number(pr.stock)||0
        };
      });
      document.getElementById('st').textContent='Catálogo cargado desde API: '+P.length+' productos';
    } else {
      throw new Error('Sin productos');
    }
  }catch(err){
    // Fallback al catálogo local
    P=P_FALLBACK;
    document.getElementById('st').textContent='Usando catálogo local ('+P.length+' productos)';
  }

  if(dailyMode){
    const products=resolveDailyProducts();
    if(!products.length){
      document.getElementById('info').textContent='No se encontraron productos para las publicaciones diarias.';
      return;
    }
    await renderDaily(products);
    return;
  }

  if(!query){
    document.getElementById('info').innerHTML='Usá <b>?q=nombre+producto&desc=15</b> en la URL para generar una promo.';
    return;
  }

  product=findProduct(query);
  if(product){
    document.getElementById('info').textContent='Producto encontrado — Descuento: '+descPct+'%';
    document.getElementById('found').textContent=product.n+' — '+product.b+' — '+fmt(product.p)+' → '+fmt(Math.round(product.p*(1-descPct/100)));
    setTimeout(()=>genPost(product,descPct,1080,1350),600);
  } else {
    document.getElementById('info').innerHTML='No se encontró "<b>'+query+'</b>" en el catálogo.<br>Verificá el nombre del producto.';
    document.getElementById('found').textContent='';
  }
}

init();

function genStory(){
  if(!product)return;
  currentMode='story';
  genPost(product,descPct,1080,1920);
  document.getElementById('st').textContent='Story 1080x1920 generada';
}

function dl(){
  const cv=document.getElementById('cv');const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,10);
  a.download='MAXUP_promo_'+(product?product.id:'post')+'_'+descPct+'off_'+d+'.png';
  a.href=cv.toDataURL('image/png');a.click();
}
